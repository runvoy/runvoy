version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
    # More linters to consider:
    # - gocognit
    # - testifylint
    # - thelper
    # - tparallel
  settings:
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocognit:
      min-complexity: 20
    godot:
      scope: declarations
      exclude:
        - "^TODO:"
        - "^FIXME:"
        - "^NOTE:"
    nestif:
      min-complexity: 5
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
    govet:
      enable:
        - shadow
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
        shadow:
          strict: true
    misspell:
      locale: US
    nolintlint:
      allow-unused: true
      require-explanation: false
  exclusions:
    rules:
      - path: '^cmd/cli/cmd'
        linters:
          - gochecknoinits
      - path: '(.+)_test\.go'
        linters:
          - mnd
          - goconst
          - funlen
          - gocyclo
          - godot
          - wrapcheck
          - gosec
          - prealloc
          - noctx
          - lll
      - path: '^scripts/'
        linters:
          - mnd
          - gosec
          - prealloc
      - path: '^internal/testutil/'
        linters:
          - gosec
      - path: '^internal/providers/aws/database/dynamodb/'
        linters:
          - prealloc
      - path: '^internal/providers/aws/'
        linters:
          - prealloc
      - path: '^cmd/cli/cmd/logs\.go'
        linters:
          - prealloc
      - path: '^internal/api/'
        linters:
          - revive
      - path: '^internal/errors/'
        linters:
          - revive
